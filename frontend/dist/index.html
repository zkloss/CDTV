<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" type="image/png" href="./TV.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <title>CDTV</title>
    <style>
      html, body { margin: 0; background: #f6f7f9; }
      #startup-screen { position: fixed; inset: 0; z-index: 50000; display: grid; place-items: center; background: #f6f7f9; color: #253047; font: 14px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; transition: opacity 180ms ease; }
      #startup-screen * { box-sizing: border-box; }
      #startup-screen.is-finished { opacity: 0; pointer-events: none; }
      .startup-drag { position: absolute; top: 0; left: 0; right: 52px; height: 44px; }
      .startup-close { position: absolute; top: 10px; right: 14px; border: 0; background: transparent; color: #5f6b7d; width: 32px; height: 32px; font-size: 22px; cursor: pointer; }
      .startup-close:hover { background: #e0e5ec; border-radius: 7px; }
      .startup-card { width: min(400px, calc(100vw - 64px)); }
      .startup-brand { display: flex; align-items: center; gap: 13px; margin-bottom: 40px; }
      .startup-mark { display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid #c4d2e6; border-radius: 14px; background: #4f70a8; color: #ffffff; font-size: 17px; font-weight: 800; }
      .startup-brand strong { display: block; font-size: 25px; letter-spacing: .02em; line-height: 1.2; }
      .startup-brand small { color: #5f6b7d; }
      .startup-card h1 { margin: 0 0 9px; font-size: 20px; font-weight: 650; }
      #startup-status { margin: 0; min-height: 23px; color: #5f6b7d; }
      .startup-progress-meta { display: flex; justify-content: space-between; margin: 28px 0 8px; color: #5f6b7d; font-size: 12px; }
      .startup-track { height: 6px; overflow: hidden; border-radius: 8px; background: #e0e5ec; }
      #startup-progress-fill { height: 100%; width: 12%; background: #4f70a8; border-radius: inherit; }
      .startup-stages { display: flex; justify-content: space-between; gap: 8px; padding: 0; margin: 17px 0 0; list-style: none; font-size: 12px; color: #778397; }
      .startup-stages li::before { display: inline-block; content: ''; width: 5px; height: 5px; margin: 0 6px 2px 0; border-radius: 50%; background: #c7ced9; }
      .startup-stages li[data-state="done"], .startup-stages li[data-state="active"] { color: #3d5d91; }
      .startup-stages li[data-state="done"]::before, .startup-stages li[data-state="active"]::before { background: #4f70a8; }
      #startup-help { margin: 25px 0 0; color: #778397; font-size: 12px; }
      #startup-actions[hidden] { display: none; }
      #startup-actions { display: flex; gap: 10px; margin-top: 18px; }
      #startup-actions button { padding: 7px 16px; border: 1px solid #b7c3d4; border-radius: 8px; background: #ffffff; color: #253047; font: inherit; cursor: pointer; }
      #startup-actions button:first-child { background: #4f70a8; border-color: #c4d2e6; color: #ffffff; }
      #startup-screen.has-error #startup-status { color: #9b3540; }
      @media (prefers-reduced-motion: reduce) { #startup-screen, #startup-progress-fill { transition: none; } }
    </style>
    <script type="module" crossorigin src="./assets/index-BYyXGLLC.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-rDtR4pZw.css">
  </head>
  <body>
    <section id="startup-screen" aria-label="CDTV 启动">
      <div class="startup-drag pywebview-drag-region"></div>
      <button class="startup-close" type="button" aria-label="关闭启动窗口">×</button>
      <div class="startup-card">
        <div class="startup-brand"><span class="startup-mark">TV</span><div><strong>CDTV</strong><small>AI 视频工作台</small></div></div>
        <h1>正在准备创作工作台</h1>
        <p id="startup-status" role="status" aria-live="polite">正在加载界面资源…</p>
        <div class="startup-progress-meta"><span>启动进度</span><span id="startup-percent">12%</span></div>
        <div class="startup-track" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12"><div id="startup-progress-fill"></div></div>
        <ol class="startup-stages"><li data-until="40" data-state="active">界面资源</li><li data-until="68">数据准备</li><li data-until="85">工作区设置</li><li data-until="100">项目数据</li></ol>
        <p id="startup-help">首次启动可能需要稍等片刻</p>
        <div id="startup-actions" hidden><button type="button" id="startup-retry">重新尝试</button><button type="button" id="startup-exit">退出</button></div>
      </div>
    </section>
    <script>
      (() => {
        const screen = document.getElementById('startup-screen');
        const status = document.getElementById('startup-status');
        const actions = document.getElementById('startup-actions');
        let progress = 12;
        let targetProgress = 35;
        let frame = 0;
        let lastFrameTime = null;
        let finishing = false;
        let finished = false;
        let failed = false;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const STAGES = [
          { until: 40, text: '正在加载界面资源…' },
          { until: 68, text: '正在读取本地数据…' },
          { until: 85, text: '正在读取工作区设置…' },
          { until: 100, text: '正在加载项目数据…' }
        ];

        const renderProgress = () => {
          const displayed = Math.min(100, Math.floor(progress));
          document.getElementById('startup-percent').textContent = displayed + '%';
          document.getElementById('startup-progress-fill').style.width = Math.min(100, progress).toFixed(2) + '%';
          screen.querySelector('[role="progressbar"]').setAttribute('aria-valuenow', String(displayed));
          let previous = 0;
          screen.querySelectorAll('[data-until]').forEach(stage => {
            const until = Number(stage.dataset.until);
            stage.dataset.state = progress >= until ? 'done' : progress >= previous ? 'active' : 'waiting';
            previous = until;
          });
        };

        // Smooth gradual stepping speed (~55% per second)
        const speed = 0.055;
        const animateProgress = time => {
          frame = 0;
          if (failed || finished) return;
          const elapsed = lastFrameTime === null ? 16 : Math.min(80, time - lastFrameTime);
          lastFrameTime = time;

          if (progress < targetProgress) {
            progress = reducedMotion ? targetProgress : Math.min(targetProgress, progress + elapsed * speed);
            renderProgress();
          }

          if (!failed && !finishing) {
            for (const st of STAGES) {
              if (progress < st.until) {
                if (status.textContent !== st.text && !status.dataset.custom) {
                  status.textContent = st.text;
                }
                break;
              }
            }
          }

          if (progress < targetProgress) {
            frame = requestAnimationFrame(animateProgress);
          } else if (finishing && progress >= 100) {
            finished = true;
            status.textContent = '准备就绪';
            requestAnimationFrame(() => requestAnimationFrame(() => {
              screen.classList.add('is-finished');
              setTimeout(() => screen.remove(), 260);
            }));
          } else if (!finishing) {
            frame = requestAnimationFrame(animateProgress);
          }
        };

        const startAnimation = () => {
          if (!frame && !finished && !failed) {
            lastFrameTime = null;
            frame = requestAnimationFrame(animateProgress);
          }
        };

        startAnimation();
        setTimeout(() => { if (!failed && targetProgress < 68) { targetProgress = 68; startAnimation(); } }, 400);
        setTimeout(() => { if (!failed && targetProgress < 85) { targetProgress = 85; startAnimation(); } }, 800);
        setTimeout(() => { if (!failed && targetProgress < 96) { targetProgress = 96; startAnimation(); } }, 1200);

        const slowTimer = setTimeout(() => {
          if (finished || failed) return;
          document.getElementById('startup-help').textContent = '启动耗时较长，仍在等待当前步骤完成。你也可以重新尝试。';
          actions.hidden = false;
        }, 20000);

        const close = () => {
          if (window.pywebview?.api?.close_window) window.pywebview.api.close_window();
          else window.close();
        };

        document.getElementById('startup-retry').addEventListener('click', () => location.reload());
        document.getElementById('startup-exit').addEventListener('click', close);
        screen.querySelector('.startup-close').addEventListener('click', close);

        window.cdtvStartup = {
          set(value, text) {
            if (finished || failed) return;
            if (text) {
              status.textContent = text;
              status.dataset.custom = 'true';
            }
            if (value > targetProgress) {
              targetProgress = Math.min(100, value);
              startAnimation();
            }
          },
          finish() {
            if (finished || failed) return;
            finishing = true;
            targetProgress = 100;
            status.textContent = '正在打开工作台…';
            startAnimation();
            clearTimeout(slowTimer);
          },
          fail(message) {
            if (finished) return;
            failed = true;
            if (frame) cancelAnimationFrame(frame);
            clearTimeout(slowTimer);
            screen.classList.add('has-error');
            status.textContent = message || '启动未能完成，请重新尝试。';
            document.getElementById('startup-help').textContent = '你的项目和素材仍保存在本地。';
            actions.hidden = false;
          },
        };
        window.addEventListener('error', event => {
          if (event.target?.tagName === 'SCRIPT' || event.target?.tagName === 'LINK') window.cdtvStartup.fail('界面资源未能加载，请重新尝试。');
        }, true);
      })();
    </script>
    <div id="app"></div>
  </body>
</html>
